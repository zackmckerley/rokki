name: Update bundle-size baseline

# Manual baseline-refresh workflow. The CI's bundle-budget job
# enforces "no route grows more than 5 KB gzipped vs the checked-in
# baseline at apps/web/scripts/bundle-baseline.json". After
# intentional growth (new dependency, new feature surface) the right
# move is regenerating the baseline so future PRs measure against
# reality.
#
# This action does that mechanically:
#   1. Spins up a Linux runner (same env CI uses to gzip).
#   2. Builds the app with the bundle analyzer.
#   3. Runs `check-bundle-size.mjs --update-baseline`.
#   4. Commits the regenerated `bundle-baseline.json` to a fresh
#      branch and opens a PR.
#
# Trigger: Actions → "Update bundle-size baseline" → Run workflow.
# There's no automatic schedule; baseline refresh is a decision a
# human makes ("the new size is intentional, accept it as the new
# floor").
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Commit message tail (after 'chore(bundle): ')"
        required: false
        default: "refresh baseline after intentional growth"

jobs:
  update:
    name: Regenerate baseline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        # peter-evans/create-pull-request does its own auth via the
        # GITHUB_TOKEN we pass it explicitly. If checkout also
        # persists credentials, the two stack and git fails with
        # "Duplicate header: Authorization" → HTTP 400 on push.
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with bundle analyzer
        run: pnpm -C apps/web bundle:analyze
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Update baseline
        run: node apps/web/scripts/check-bundle-size.mjs --update-baseline

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bundle-baseline-refresh
          base: main
          title: "chore(bundle): ${{ github.event.inputs.message }}"
          commit-message: |
            chore(bundle): ${{ github.event.inputs.message }}

            Auto-generated by the "Update bundle-size baseline"
            workflow. Regenerated bundle-baseline.json from a fresh
            CI-environment build after intentional growth. Review
            the per-route deltas and merge if the new sizes are the
            intended floor.
          body: |
            Auto-generated baseline refresh. The CI's bundle-budget
            job auto-fails on >5 KB gzipped regressions per route
            vs `apps/web/scripts/bundle-baseline.json`. After
            intentional growth (new feature surface, new dep), this
            PR captures the new sizes as the new floor so future
            PRs measure against reality.

            **Review tip:** scan the per-route deltas in the diff.
            If any growth is much larger than expected, dig into
            the analyzer artifact attached to the latest CI run for
            this PR and confirm the new dependency / chunk is
            intentional.
          delete-branch: true
          add-paths: |
            apps/web/scripts/bundle-baseline.json
