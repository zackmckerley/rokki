name: Regenerate DB types

# Regenerates packages/db/src/generated.ts from the migrations, in CI, so it
# can be refreshed WITHOUT a local Docker/Supabase install on anyone's machine.
#
# Why this exists: `generated.ts` is hand-refreshed via `supabase gen types
# typescript --local`, which needs a running local Supabase (Docker). When that
# file goes stale (a migration adds a column the types don't know about, e.g.
# tasks.starred, spaces.is_personal, or the whole mkt_* set), the loose
# `AnySupabaseClient = any` boundaries hide it — but a stricter supabase-js
# turns the drift into hard `.select()` type errors. Rather than depend on a dev
# having Docker, this workflow does the regen on a Linux runner (the same place
# the db-lint job already spins up Supabase) and opens a PR with the result.
#
# Trigger: Actions → "Regenerate DB types" → Run workflow. Review the diff
# (it should be purely additive — new tables/columns) and merge.

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Commit message tail (after 'chore(db): ')"
        required: false
        default: "regenerate generated.ts from migrations"

jobs:
  regen:
    name: Regenerate generated.ts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        # peter-evans/create-pull-request authenticates via the GITHUB_TOKEN we
        # pass it. If checkout also persists credentials they stack and the push
        # fails with "Duplicate header: Authorization". (Same note as the
        # visual-baseline workflow.)
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Apply migrations
        run: supabase db reset

      - name: Regenerate types
        # `--local` reads the running local stack started above. Overwrite the
        # committed file so peter-evans sees the diff.
        run: supabase gen types typescript --local > packages/db/src/generated.ts

      - name: Stop Supabase
        if: always()
        run: supabase stop

      - name: Show diff summary
        run: git --no-pager diff --stat packages/db/src/generated.ts || true

      - name: Open types-refresh PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/regen-db-types
          base: main
          add-paths: packages/db/src/generated.ts
          title: "chore(db): ${{ github.event.inputs.message }}"
          commit-message: |
            chore(db): ${{ github.event.inputs.message }}

            Auto-generated by the "Regenerate DB types" workflow:
            `supabase gen types typescript --local` against a fresh
            `supabase db reset`. Picks up every column/table the
            migrations declare (e.g. mkt_* tables, tasks.starred,
            spaces.is_personal). Review the diff — it should be purely
            additive — and merge.
          body: |
            Auto-generated `generated.ts` refresh from the migrations.

            This unblocks the Supabase type work that was gated on a local
            Docker `gen types`: once merged, the `AnySupabaseClient = any`
            boundaries (markets `marketsDb`, dashboard/calendar/space queries)
            can be replaced with real generated types, and a supabase-js bump
            stops surfacing stale-column `.select()` errors.

            **Review tip:** the diff should only ADD tables/columns. If
            anything is removed, a migration may be missing locally — investigate
            before merging.
          delete-branch: true
