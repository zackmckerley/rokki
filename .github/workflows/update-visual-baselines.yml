name: Update visual snapshot baselines

# Manual baseline-refresh workflow. The CI's visual-regression job is
# `continue-on-error: true` — failures don't block PRs, they just flag
# for human review. After a UI change that legitimately moves pixels
# (icons, fonts, density tweaks), the right move is to regenerate the
# baseline images and commit the fresh PNGs.
#
# This action does that mechanically:
#   1. Spins up a Linux runner (same env CI uses to render snapshots).
#   2. Builds the app and runs Playwright with `--update-snapshots`.
#   3. Commits the regenerated `__snapshots__/` PNGs to a fresh branch.
#   4. Opens a PR for review.
#
# Trigger: Actions → "Update visual snapshot baselines" → Run
# workflow. There's no automatic schedule; baseline refresh is a
# decision a human makes ("I changed the UI on purpose, accept the
# new look").
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Commit message tail (after 'chore(visual): ')"
        required: false
        default: "refresh baselines after UI changes"

jobs:
  update:
    name: Regenerate baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        # peter-evans/create-pull-request does its own auth via the
        # GITHUB_TOKEN we pass it explicitly. If checkout also
        # persists credentials, the two stack and git fails with
        # "Duplicate header: Authorization" → HTTP 400 on push.
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm -C apps/web exec playwright install chromium --with-deps

      - name: Install system deps for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium

      - name: Build app
        run: pnpm -C apps/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Update snapshots
        # `--update-snapshots` writes any failing baseline rather
        # than diffing against it. With CI's deterministic env this
        # produces stable PNGs we can commit.
        #
        # `continue-on-error: true` is intentional. In refresh mode
        # we WANT every successful capture to land regardless of
        # whether one or two tests are flaky (e.g. a synthetic 500
        # route that times out waiting for fonts). The next step
        # commits whatever snapshots Playwright managed to write —
        # baselines for the flaky tests stay at their old values
        # until they stabilize. Without this, a single flaky test
        # aborts the whole refresh and Zack ends up with nothing.
        continue-on-error: true
        run: pnpm -C apps/web test:e2e --project=visual --update-snapshots
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/visual-baseline-refresh
          base: main
          title: "chore(visual): ${{ github.event.inputs.message }}"
          commit-message: |
            chore(visual): ${{ github.event.inputs.message }}

            Auto-generated by the "Update visual snapshot baselines"
            workflow. Regenerated all `__snapshots__/` PNGs from a
            CI-environment Playwright run after intentional UI
            changes. Review the diff and merge if the new look is
            what you want.
          body: |
            Auto-generated baseline refresh. The CI's visual-regression
            job is `continue-on-error`, so failures don't block PRs —
            they just flag pixel diffs for human review. This PR
            captures fresh baselines after intentional UI changes.

            **Review tip:** open each updated PNG and confirm the new
            screenshot is what you intended. If anything looks wrong,
            close this PR and either revert the underlying UI change
            or amend the visual spec.
          delete-branch: true
          # Playwright writes baselines to `<spec>-snapshots/` per
          # spec file (apps/web/tests/visual/public-pages.spec.ts
          # → public-pages.spec.ts-snapshots/), NOT a single
          # `__snapshots__/` dir. Match the actual layout or
          # peter-evans finds nothing to commit.
          add-paths: |
            apps/web/tests/visual/**/*-snapshots/**
